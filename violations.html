<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>

body {
    font-family: Arial;
    background:#f4f4f4;
    padding:20px;
}

h2 {
    text-align:center;
}

table {
    width:100%;
    border-collapse: collapse;
    background:white;
}

th {
    background:#2a5298;
    color:white;
    padding:10px;
}

td {
    text-align:center;
    padding:10px;
}

tr:nth-child(even) {
    background:#f2f2f2;
}

.fine {
    color:red;
    font-weight:bold;
}

</style>

</head>

<body>

<h2>📊 Violations Dashboard</h2>

<table>

<tr>
<th>ID</th>
<th>Vehicle</th>
<th>Entry</th>
<th>Exit</th>
<th>Duration</th>
<th>Fine</th>
<th>Source</th>
</tr>

{% for row in data %}
<tr>
<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
<td>{{ row[4] }}</td>
<td class="fine">₹{{ row[5] }}</td>
<td>{{ row[6] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
